packages:
  - 'apps/*'
  - 'packages/*'

strictPeerDependencies: true
saveExact: true
minimumReleaseAge: 1440

# pnpm blocks dependency lifecycle scripts unless they are explicitly reviewed.
# unrs-resolver prepares its native resolver binding; supabase installs the pinned CLI binary.
allowBuilds:
  unrs-resolver: true
  supabase: true

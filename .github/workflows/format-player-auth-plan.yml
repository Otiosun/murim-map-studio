name: Format player auth plan

on:
  push:
    branches:
      - foundation/player-auth-v0
    paths:
      - '.github/workflows/format-player-auth-plan.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: foundation/player-auth-v0
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format plan and RED test
        run: pnpm prettier --write docs/superpowers/plans/2026-08-30-player-auth-projection-boundary.md apps/player/lib/auth/auth-config.test.ts
      - name: Remove temporary workflow
        run: rm .github/workflows/format-player-auth-plan.yml
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-08-30-player-auth-projection-boundary.md apps/player/lib/auth/auth-config.test.ts .github/workflows/format-player-auth-plan.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: format player auth plan'
          git push origin HEAD:foundation/player-auth-v0

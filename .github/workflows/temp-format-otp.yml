name: Temporary format OTP test

on:
  push:
    branches:
      - foundation/player-auth-v0
    paths:
      - .github/workflows/temp-format-otp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: foundation/player-auth-v0
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          check-latest: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact RED test and self-delete
        run: |
          pnpm exec prettier --write apps/player/lib/auth/otp.test.ts
          rm .github/workflows/temp-format-otp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/player/lib/auth/otp.test.ts .github/workflows/temp-format-otp.yml
          git commit -m "style: apply canonical OTP test formatting"
          git push origin HEAD:foundation/player-auth-v0

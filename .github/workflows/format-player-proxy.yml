name: Format player proxy once

on:
  push:
    branches:
      - foundation/player-auth-v0
    paths:
      - '.github/workflows/format-player-proxy.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: foundation/player-auth-v0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only player proxy
        run: pnpm prettier --write apps/player/lib/supabase/proxy.ts

      - name: Verify formatter result
        run: pnpm prettier --check apps/player/lib/supabase/proxy.ts

      - name: Remove temporary workflow
        run: rm .github/workflows/format-player-proxy.yml

      - name: Commit generated formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/player/lib/supabase/proxy.ts .github/workflows/format-player-proxy.yml
          git commit -m 'chore: apply canonical player proxy formatting'
          git push origin HEAD:foundation/player-auth-v0

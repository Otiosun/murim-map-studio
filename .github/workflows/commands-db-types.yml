name: Command persistence types bootstrap

on:
  push:
    branches:
      - foundation/commands-v0

permissions:
  contents: write

jobs:
  generate-types-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild local database
        run: |
          pnpm db:start
          pnpm db:reset

      - name: Generate canonical database types
        run: |
          pnpm db:types > supabase/database.types.ts
          pnpm prettier --write supabase/database.types.ts

      - name: Commit generated types once
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/database.types.ts
          git commit -m 'chore(db): regenerate command persistence types'
          git push

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

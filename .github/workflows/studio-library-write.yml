name: Studio asset library write

on:
  push:
    branches:
      - foundation/assets-v0

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: foundation/assets-v0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Patch Studio source
        run: python3 .github/scripts/studio-library-patch.py
      - name: Update workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format changed sources
        run: |
          pnpm prettier --write \
            apps/studio/app/studio-app-v2.tsx \
            apps/studio/app/globals.css \
            apps/studio/app/studio-asset-visual.tsx \
            apps/studio/app/studio-library-panel.tsx \
            apps/studio/lib/studio-assets.ts \
            apps/studio/lib/studio-model.ts \
            apps/studio/lib/studio-model.test.ts \
            apps/studio/package.json \
            packages/domain/src/assets.ts \
            packages/domain/src/index.ts \
            packages/world-schema/src/asset-template-tools.ts \
            packages/world-schema/src/asset-template-tools.test.ts \
            packages/world-schema/src/index.ts \
            apps/studio/public/assets/murim/*.svg
      - name: Validate full repository quality
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit only validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-library-write.yml .github/scripts/studio-library-patch.py
          git add apps/studio packages/domain packages/world-schema pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "studio: integrate searchable assets and templates"
          git push origin HEAD:foundation/assets-v0

name: Format Player Knowledge plan

on:
  push:
    branches:
      - foundation/player-knowledge-v0

permissions:
  contents: write

jobs:
  format-plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: foundation/player-knowledge-v0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          check-latest: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format plan and remove helper
        run: |
          pnpm exec prettier --write docs/superpowers/plans/2026-08-30-player-knowledge-core.md
          git rm .github/workflows/format-player-knowledge-plan.yml

      - name: Commit formatted plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-30-player-knowledge-core.md
          git commit -m "chore: format Player Knowledge plan"
          git push origin HEAD:foundation/player-knowledge-v0

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'foundation/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned database tooling
        run: |
          docker --version
          pnpm supabase --version

      - name: Start local Supabase
        run: pnpm db:start

      - name: Rebuild database from Git
        run: pnpm db:reset

      - name: RLS and leakage tests
        run: pnpm db:test

      - name: Verify generated database types are current
        run: |
          pnpm db:types > supabase/database.types.generated.ts
          pnpm prettier --write supabase/database.types.generated.ts
          diff -u supabase/database.types.ts supabase/database.types.generated.ts
          rm supabase/database.types.generated.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

name: Asset foundation format write

on:
  push:
    branches:
      - foundation/assets-v0

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: foundation/assets-v0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format asset foundation files
        run: pnpm prettier --write packages/world-schema/src/asset-template-tools.ts
      - name: Validate quality
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit only validated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/assets-format-write.yml
          git add packages/world-schema/src/asset-template-tools.ts
          git diff --cached --quiet && exit 0
          git commit -m "assets: validate manifest and template foundation"
          git push origin HEAD:foundation/assets-v0

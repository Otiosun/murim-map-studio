name: Domain format bootstrap

on:
  push:
    branches:
      - foundation/domain-v0

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Format and commit once
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm format
          if git diff --quiet; then
            echo 'Formatting already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain packages/map-renderer packages/world-schema
          git commit -m 'style: apply canonical formatting to domain contracts'
          git push origin HEAD:foundation/domain-v0

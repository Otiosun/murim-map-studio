name: Bootstrap player auth dependencies

on:
  push:
    branches:
      - foundation/player-auth-v0
    paths:
      - '.github/workflows/bootstrap-player-auth-deps.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: foundation/player-auth-v0
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install canonical dependencies
        run: pnpm install --frozen-lockfile
      - name: Add player Auth SSR dependencies
        run: pnpm --filter @murim/player add --save-exact @supabase/ssr @supabase/supabase-js
      - name: Verify Task 1
        run: |
          pnpm vitest run apps/player/lib/auth/auth-config.test.ts
          pnpm typecheck
      - name: Remove temporary workflow
        run: rm .github/workflows/bootstrap-player-auth-deps.yml
      - name: Commit generated dependency state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/player/package.json pnpm-lock.yaml .github/workflows/bootstrap-player-auth-deps.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: pin player auth dependencies'
          git push origin HEAD:foundation/player-auth-v0

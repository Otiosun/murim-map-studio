name: Commands formatter bootstrap

on:
  push:
    branches:
      - foundation/commands-v0

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format command engine exactly once
        run: |
          pnpm exec prettier --write packages/domain/src/commands.ts packages/domain/src/commands.test.ts packages/domain/src/history.ts packages/domain/src/index.ts
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/src/commands.ts packages/domain/src/commands.test.ts packages/domain/src/history.ts packages/domain/src/index.ts
          git commit -m 'style(domain): format command engine'
          git push

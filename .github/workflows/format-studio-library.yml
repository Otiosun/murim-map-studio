name: Format studio library

on:
  push:
    branches:
      - foundation/assets-v0
    paths:
      - .github/workflows/format-studio-library.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format exact component
        run: pnpm exec prettier --write apps/studio/app/studio-library-panel.tsx
      - name: Commit formatter output and remove helper
        run: |
          rm .github/workflows/format-studio-library.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/app/studio-library-panel.tsx .github/workflows/format-studio-library.yml
          git commit -m "chore: format studio library with repo Prettier"
          git push

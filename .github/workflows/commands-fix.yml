name: Commands fix bootstrap

on:
  push:
    branches:
      - foundation/commands-v0

permissions:
  contents: write

jobs:
  fix-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reviewed command-engine fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          entities = Path('packages/domain/src/entities.ts')
          text = entities.read_text()
          old = "export type OpportunityState = 'available' | 'dormant' | 'blocked' | 'consumed';"
          new = "export const OPPORTUNITY_STATES = ['available', 'dormant', 'blocked', 'consumed'] as const;\n\nexport type OpportunityState = (typeof OPPORTUNITY_STATES)[number];"
          assert old in text, 'OpportunityState anchor changed'
          text = text.replace(old, new, 1)

          old = "export type CaseState =\n  | 'available'\n  | 'open'\n  | 'active'\n  | 'paused'\n  | 'resolved'\n  | 'failed'\n  | 'escalated'\n  | 'transformed'\n  | 'archived';"
          new = "export const CASE_STATES = [\n  'available',\n  'open',\n  'active',\n  'paused',\n  'resolved',\n  'failed',\n  'escalated',\n  'transformed',\n  'archived',\n] as const;\n\nexport type CaseState = (typeof CASE_STATES)[number];"
          assert old in text, 'CaseState anchor changed'
          text = text.replace(old, new, 1)
          entities.write_text(text)

          commands = Path('packages/domain/src/commands.ts')
          text = commands.read_text()
          old = "const isNonNegativeInteger = (value: JsonValue): boolean =>\n  isFiniteNumber(value) && Number.isInteger(value) && value >= 0;\nconst isConfidence = (value: JsonValue): boolean =>\n  isFiniteNumber(value) && typeof value === 'number' && value >= 0 && value <= 1;"
          new = "const isNonNegativeInteger = (value: JsonValue): boolean =>\n  typeof value === 'number' && Number.isFinite(value) && Number.isInteger(value) && value >= 0;\nconst isConfidence = (value: JsonValue): boolean =>\n  typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= 1;"
          assert old in text, 'numeric guard anchor changed'
          text = text.replace(old, new, 1)
          text = text.replace("const optionalStringArrayRule: PropertyRule = { validate: isStringArray, canUnset: true };\n", "", 1)
          text = text.replace("\nvoid optionalStringArrayRule;\n", "\n", 1)
          old = "      from: previousPosition,\n      to: nextPosition,"
          new = "      from: { x: previousPosition.x, y: previousPosition.y },\n      to: { x: nextPosition.x, y: nextPosition.y },"
          assert old in text, 'audit point anchor changed'
          text = text.replace(old, new, 1)
          commands.write_text(text)

          tests = Path('packages/domain/src/commands.test.ts')
          text = tests.read_text()
          marker = "\n});\n"
          assert text.endswith(marker), 'commands test suite ending changed'
          extra = r'''

  it('supports a multi-command LIFO undo/redo chain without losing ordering', () => {
    const first = executeWithHistory(
      document(),
      createCommandHistory(),
      command('cmd-chain-move', {
        kind: 'MoveEntity',
        entityId: LOCATION_A_ID,
        position: { x: 210, y: 220 },
      }),
    );
    expect(first.ok).toBe(true);
    if (!first.ok) return;

    const second = executeWithHistory(
      first.document,
      first.history,
      command('cmd-chain-update', {
        kind: 'UpdateProperty',
        entityId: LOCATION_A_ID,
        property: 'name',
        mutation: { operation: 'set', value: 'Qinghe em Obras' },
      }),
    );
    expect(second.ok).toBe(true);
    if (!second.ok) return;

    const third = executeWithHistory(
      second.document,
      second.history,
      command('cmd-chain-connect', {
        kind: 'ConnectRoute',
        routeId: NEW_ROUTE_ID,
        fromLocationId: LOCATION_B_ID,
        toLocationId: LOCATION_C_ID,
        routeKind: 'trail',
        bidirectional: true,
        tags: [],
      }),
    );
    expect(third.ok).toBe(true);
    if (!third.ok) return;
    expect(third.history.past).toHaveLength(3);

    const undo3 = undoWithHistory(third.document, third.history, meta('undo-chain-3'));
    expect(undo3.ok).toBe(true);
    if (!undo3.ok) return;
    expect(undo3.document.entities.some((item) => item.id === NEW_ROUTE_ID)).toBe(false);

    const undo2 = undoWithHistory(undo3.document, undo3.history, meta('undo-chain-2'));
    expect(undo2.ok).toBe(true);
    if (!undo2.ok) return;
    expect(entity<LocationEntity>(undo2.document, LOCATION_A_ID).name).toBe('Vila Qinghe');

    const undo1 = undoWithHistory(undo2.document, undo2.history, meta('undo-chain-1'));
    expect(undo1.ok).toBe(true);
    if (!undo1.ok) return;
    expect(entity<LocationEntity>(undo1.document, LOCATION_A_ID).position).toEqual(locationA.position);
    expect(undo1.history.past).toHaveLength(0);
    expect(undo1.history.future).toHaveLength(3);

    const redo1 = redoWithHistory(undo1.document, undo1.history, meta('redo-chain-1'));
    expect(redo1.ok).toBe(true);
    if (!redo1.ok) return;
    expect(entity<LocationEntity>(redo1.document, LOCATION_A_ID).position).toEqual({ x: 210, y: 220 });

    const redo2 = redoWithHistory(redo1.document, redo1.history, meta('redo-chain-2'));
    expect(redo2.ok).toBe(true);
    if (!redo2.ok) return;
    expect(entity<LocationEntity>(redo2.document, LOCATION_A_ID).name).toBe('Qinghe em Obras');

    const redo3 = redoWithHistory(redo2.document, redo2.history, meta('redo-chain-3'));
    expect(redo3.ok).toBe(true);
    if (!redo3.ok) return;
    expect(redo3.document.entities.some((item) => item.id === NEW_ROUTE_ID)).toBe(true);
    expect(redo3.history.past).toHaveLength(3);
    expect(redo3.history.future).toHaveLength(0);
  });

  it('clears the redo branch only after a new command commits successfully', () => {
    const moved = executeWithHistory(
      document(),
      createCommandHistory(),
      command('cmd-branch-move', {
        kind: 'MoveEntity',
        entityId: LOCATION_C_ID,
        position: { x: 360, y: 370 },
      }),
    );
    expect(moved.ok).toBe(true);
    if (!moved.ok) return;

    const undone = undoWithHistory(moved.document, moved.history, meta('cmd-branch-undo'));
    expect(undone.ok).toBe(true);
    if (!undone.ok) return;
    expect(undone.history.future).toHaveLength(1);

    const failed = executeWithHistory(
      undone.document,
      undone.history,
      command('cmd-branch-fail', {
        kind: 'UpdateProperty',
        entityId: LOCATION_C_ID,
        property: 'id',
        mutation: { operation: 'set', value: 'forbidden' },
      }),
    );
    expect(failed.ok).toBe(false);
    expect(failed.document).toBe(undone.document);
    expect(failed.history).toBe(undone.history);
    expect(failed.history.future).toHaveLength(1);

    const committed = executeWithHistory(
      undone.document,
      undone.history,
      command('cmd-branch-new', {
        kind: 'UpdateProperty',
        entityId: LOCATION_C_ID,
        property: 'name',
        mutation: { operation: 'set', value: 'Poço Catalogado' },
      }),
    );
    expect(committed.ok).toBe(true);
    if (!committed.ok) return;
    expect(committed.history.future).toHaveLength(0);

    const noRedo = redoWithHistory(committed.document, committed.history, meta('cmd-no-redo'));
    expect(noRedo).toMatchObject({ ok: false, error: { code: 'history_empty' } });
  });

  it('rejects malformed metadata before touching the document', () => {
    const original = document();
    const result = applyWorldCommand(original, {
      meta: { ...meta('cmd-invalid-meta'), correlationId: '' },
      payload: {
        kind: 'MoveEntity',
        entityId: LOCATION_C_ID,
        position: { x: 1, y: 2 },
      },
    });

    expect(result).toMatchObject({ ok: false, error: { code: 'invalid_metadata' } });
    expect(entity<LocationEntity>(original, LOCATION_C_ID).position).toEqual(locationC.position);
  });
'''
          tests.write_text(text[:-len(marker)] + extra + marker)
          PY

      - name: Canonical formatting
        run: pnpm exec prettier --write packages/domain/src/entities.ts packages/domain/src/commands.ts packages/domain/src/commands.test.ts packages/domain/src/history.ts packages/domain/src/index.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Commit validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/src/entities.ts packages/domain/src/commands.ts packages/domain/src/commands.test.ts packages/domain/src/history.ts packages/domain/src/index.ts
          git commit -m 'fix(domain): harden command engine contracts'
          git push

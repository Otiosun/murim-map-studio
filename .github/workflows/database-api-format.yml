name: Database API formatter bootstrap

on:
  push:
    branches:
      - foundation/database-v0

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format API leakage test exactly once
        run: |
          pnpm prettier --write scripts/database-api-leakage-test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/database-api-leakage-test.mjs
          if git diff --cached --quiet; then
            echo "API leakage test already formatted."
          else
            git commit -m "style: format PostgREST leakage smoke"
            git push origin HEAD:foundation/database-v0
          fi

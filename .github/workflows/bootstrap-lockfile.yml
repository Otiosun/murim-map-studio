name: Bootstrap lockfile

on:
  push:
    branches:
      - foundation/bootstrap-v0

permissions:
  contents: write

jobs:
  commit-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Generate and commit lockfile once
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            echo 'Lockfile already exists; nothing to bootstrap.'
            exit 0
          fi

          pnpm install --lockfile-only --no-frozen-lockfile

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: commit reproducible pnpm lockfile'
          git push origin HEAD:foundation/bootstrap-v0

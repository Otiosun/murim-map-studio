name: Studio V2 format write

on:
  push:
    branches:
      - foundation/studio-v0

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: foundation/studio-v0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format new Studio files
        run: pnpm prettier --write apps/studio/app/studio-app-v2.tsx apps/studio/lib/studio-model.ts apps/studio/lib/studio-model.test.ts

      - name: Validate quality
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit only validated formatting
        run: |
          rm .github/workflows/studio-v2-format-write.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/app/studio-app-v2.tsx apps/studio/lib/studio-model.ts apps/studio/lib/studio-model.test.ts .github/workflows/studio-v2-format-write.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "studio: validate registry persistence and touch V2"
          git push origin HEAD:foundation/studio-v0
